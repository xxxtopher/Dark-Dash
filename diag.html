<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Options Flow Diagnostic</title>
<style>body{background:#0d1117;color:#c8d8e8;font-family:monospace;padding:20px;font-size:12px}
.ok{color:#00e676}.fail{color:#ff4444}.warn{color:#ffd700}
button{background:#1e2a38;color:#c8d8e8;border:1px solid #253040;padding:8px 16px;cursor:pointer;font-family:monospace;margin:4px;font-size:12px}
pre{background:#131920;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;font-size:10px;max-height:300px;overflow-y:auto}
</style></head>
<body>
<h2 style="color:#f472b6">Options Flow Diagnostic</h2>
<button onclick="test('SPY')">Test SPY options</button>
<button onclick="test2('SPY')">Test v8 endpoint</button>
<button onclick="test3('SPY')">Test quote endpoint</button>
<div id="out"></div>
<script>
const WORKER = 'https://yahoo-proxy.topherho.workers.dev';
const YF1 = 'https://query1.finance.yahoo.com';
const YF2 = 'https://query2.finance.yahoo.com';
const log = (msg, cls='') => { document.getElementById('out').innerHTML += '<div class="'+cls+'">'+msg+'</div>'; };
const logPre = (label, txt) => { document.getElementById('out').innerHTML += '<div style="color:#6a8aa0;margin-top:4px">'+label+'</div><pre>'+String(txt).replace(/</g,'&lt;').slice(0,2000)+'</pre>'; };

async function fetchUrl(url) {
  const res = await fetch(`${WORKER}?url=${encodeURIComponent(url)}`, {signal: AbortSignal.timeout(10000)});
  return { status: res.status, text: await res.text() };
}

async function test(sym) {
  log('<br>--- v7 options endpoint ---');
  const { status, text } = await fetchUrl(`${YF2}/v7/finance/options/${sym}`);
  log(`Status: ${status}, Size: ${text.length}`, status===200?'ok':'fail');
  try {
    const d = JSON.parse(text);
    const result = d?.optionChain?.result?.[0];
    log('optionChain.result: ' + (result ? 'found' : 'missing'), result?'ok':'fail');
    if (result) {
      const calls = result.options?.[0]?.calls ?? [];
      const puts  = result.options?.[0]?.puts  ?? [];
      log(`Calls: ${calls.length}, Puts: ${puts.length}`, 'ok');
      log(`Expiry dates: ${result.expirationDates?.slice(0,3).map(t=>new Date(t*1000).toLocaleDateString()).join(', ')}`);
      const callVol = calls.reduce((s,c)=>s+(c.volume??0),0);
      const putVol  = puts.reduce((s,p)=>s+(p.volume??0),0);
      log(`Call vol: ${callVol}, Put vol: ${putVol}, P/C: ${(putVol/callVol).toFixed(2)}`, 'ok');
    } else {
      logPre('Raw response:', text);
    }
  } catch(e) { log('Parse error: '+e.message,'fail'); logPre('Raw:',text); }
}

async function test2(sym) {
  log('<br>--- v8 chart options ---');
  const urls = [
    `${YF2}/v8/finance/options/${sym}`,
    `${YF1}/v7/finance/options/${sym}`,
    `${YF2}/v7/finance/options/${sym}?date=`,
  ];
  for (const url of urls) {
    const { status, text } = await fetchUrl(url);
    log(`[${status}] ${url.replace('https://query2.finance.yahoo.com','YF2').replace('https://query1.finance.yahoo.com','YF1')} — ${text.length}b`, status===200?'ok':'fail');
    if (status===200 && text.includes('calls')) { log('  ✓ Has calls data','ok'); break; }
  }
}

async function test3(sym) {
  log('<br>--- Quote endpoint for reference ---');
  const { status, text } = await fetchUrl(`${YF2}/v8/finance/chart/${sym}?range=1d&interval=1d`);
  log(`Chart endpoint: ${status}, ${text.length}b`, status===200?'ok':'fail');
}
</script>
</body>
</html>
